name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./internal/...
      - run: go test -race ./internal/pkg/lume ./internal/pkg/guestagent ./internal/app/run ./internal/app/cmd
      - run: go vet ./...
      - run: go build ./...
      - name: Test release installer
        if: matrix.os == 'macos-14'
        env:
          GITEA_RUNNER_LUME_INSTALL_DIR: ${{ runner.temp }}/installer-bin
        run: |
          ./install.sh
          "$GITEA_RUNNER_LUME_INSTALL_DIR/gitea-runner-lume" version | grep -Eq '^gitea-runner-lume [0-9]+\.[0-9]+\.[0-9]+$'

  act-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate workflows and release signing guard
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          shellcheck install.sh
          ./scripts/codesign-release-binary_test.sh
      - run: go test ./act/model ./act/exprparser ./act/common/... ./act/filecollector ./act/lookpath
