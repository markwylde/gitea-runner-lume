version: 2

project_name: gitea-runner-lume

before:
  hooks:
    - go mod tidy

builds:
  - id: macos-arm64
    binary: gitea-runner-lume
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X gitea.com/gitea/runner/internal/pkg/ver.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_macOS_arm64"
    files:
      - LICENSE
      - README.md
      - UPSTREAM.md
      - LUME.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
